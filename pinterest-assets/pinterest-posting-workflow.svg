<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ef"/>
      <stop offset="100%" stop-color="#f0e2d3"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="110" y="110" font-size="54" font-family="Avenir Next, Segoe UI, Arial" font-weight="800" fill="#1d180f">Pinterest Posting Flow</text>
  <text x="110" y="165" font-size="24" font-family="Avenir Next, Segoe UI, Arial" fill="#6a5848">Use this sequence every time you publish a new Pin.</text>

  <g>
    <rect x="110" y="250" width="250" height="140" rx="28" fill="#fffdfa" stroke="#d9c4ac"/>
    <text x="145" y="305" font-size="24" font-family="Avenir Next, Segoe UI, Arial" font-weight="700" fill="#8a3f17">Step 1</text>
    <text x="145" y="350" font-size="34" font-family="Avenir Next, Segoe UI, Arial" font-weight="800" fill="#1d180f">Click Create</text>
  </g>

  <g>
    <rect x="430" y="250" width="250" height="140" rx="28" fill="#fffdfa" stroke="#d9c4ac"/>
    <text x="465" y="305" font-size="24" font-family="Avenir Next, Segoe UI, Arial" font-weight="700" fill="#8a3f17">Step 2</text>
    <text x="465" y="350" font-size="34" font-family="Avenir Next, Segoe UI, Arial" font-weight="800" fill="#1d180f">Upload Image</text>
  </g>

  <g>
    <rect x="750" y="250" width="250" height="140" rx="28" fill="#fffdfa" stroke="#d9c4ac"/>
    <text x="785" y="305" font-size="24" font-family="Avenir Next, Segoe UI, Arial" font-weight="700" fill="#8a3f17">Step 3</text>
    <text x="785" y="350" font-size="34" font-family="Avenir Next, Segoe UI, Arial" font-weight="800" fill="#1d180f">Paste Title</text>
  </g>

  <g>
    <rect x="1070" y="250" width="220" height="140" rx="28" fill="#fffdfa" stroke="#d9c4ac"/>
    <text x="1105" y="305" font-size="24" font-family="Avenir Next, Segoe UI, Arial" font-weight="700" fill="#8a3f17">Step 4</text>
    <text x="1105" y="350" font-size="34" font-family="Avenir Next, Segoe UI, Arial" font-weight="800" fill="#1d180f">Paste Description</text>
  </g>

  <g stroke="#c4632d" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M360 320 L420 320"/>
    <path d="M680 320 L740 320"/>
    <path d="M1000 320 L1060 320"/>
  </g>

  <g>
    <rect x="220" y="520" width="300" height="150" rx="28" fill="#fffdfa" stroke="#d9c4ac"/>
    <text x="255" y="580" font-size="24" font-family="Avenir Next, Segoe UI, Arial" font-weight="700" fill="#8a3f17">Step 5</text>
    <text x="255" y="625" font-size="34" font-family="Avenir Next, Segoe UI, Arial" font-weight="800" fill="#1d180f">Paste Destination Link</text>
  </g>

  <g>
    <rect x="560" y="520" width="280" height="150" rx="28" fill="#fffdfa" stroke="#d9c4ac"/>
    <text x="595" y="580" font-size="24" font-family="Avenir Next, Segoe UI, Arial" font-weight="700" fill="#8a3f17">Step 6</text>
    <text x="595" y="625" font-size="34" font-family="Avenir Next, Segoe UI, Arial" font-weight="800" fill="#1d180f">Choose the Board</text>
  </g>

  <g>
    <rect x="880" y="520" width="300" height="150" rx="28" fill="#c4632d"/>
    <text x="915" y="580" font-size="24" font-family="Avenir Next, Segoe UI, Arial" font-weight="700" fill="#fffdfa">Step 7</text>
    <text x="915" y="625" font-size="34" font-family="Avenir Next, Segoe UI, Arial" font-weight="800" fill="#fffdfa">Publish the Pin</text>
  </g>

  <g stroke="#c4632d" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M520 595 L550 595"/>
    <path d="M840 595 L870 595"/>
  </g>

  <text x="110" y="790" font-size="28" font-family="Avenir Next, Segoe UI, Arial" fill="#5f5247">Tip: one image should point to one calculator page, not the homepage.</text>
</svg>
